# openarch — the architecture-mechanism layer.
#
# ⚠️ THE DIRECTORY TREE IS THE ARCHITECTURE, AND IT WAS NOT UNTIL 0.3.1.
#
# Until then the specification and both backends lived in one package, with the
# backends under `src/arch/<arch>/`. That arrangement compiled, and it hid a
# constraint: `openarch.pte`, `openarch.trap` and `openarch.cpu` were
# implemented by MODULE IMPLEMENTATION UNITS, which C++ requires to live in the
# same module — and therefore, here, in the same package. The layering was a
# convention held up by a directory name.
#
# Splitting the packages made that constraint visible and forced the fix: every
# backend now crosses into the specification through a C ABI
# (`spec/include/openarch/abi.h`), which is what `openarch.context` already did
# and what openkal has always done. The gain is not tidiness — it is that a
# specification whose boundary is a C ABI can be implemented by something that
# is not a C++ module, and one whose boundary is a C++ module cannot.
#
#   abi/                   the contract. Headers only; depends on nothing.
#   spec/                  the C++ modules over the contract. Owns every
#                          module; owns no instruction.
#   backends/<arch>/       one package per instruction set. Owns instructions;
#                          exports no module.
#   examples/switch/       one probe source, run on every machine.
#
# ⚠️ A backend is selected by the TARGET, not by the consumer. `spec/mcpp.toml`
# pulls it through a `cfg` dependency, so a consumer writes `openarch = "..."`
# and nothing about its own architecture — which is the property the
# single-package layout had and which a split must not cost.
[workspace]
members = [
    "abi",
    "spec",
    "backends/riscv64",
    "backends/aarch64",
    "examples/switch",
]
