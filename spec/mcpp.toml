# openarch — the specification: modules, and the C ABI a backend implements.
#
# ⚠️ THIS PACKAGE CONTAINS NO INSTRUCTION FOR ANY MACHINE. Every `asm` in the
# project lives under `backends/`, and the boundary between the two is
# `include/openarch/abi.h`. If a register name ever appears here, the layering
# has been lost.
[package]
namespace   = "mcpplibs"
name        = "openarch"
version     = "0.3.1"
description = "openarch: the architecture-mechanism layer — execution contexts, traps, per-CPU state and address spaces, as one interface over several instruction sets"
license     = "Apache-2.0"
authors     = ["mcpplibs"]
repo        = "https://github.com/mcpplibs/openarch"

[build]
sources = ["src/*.cppm"]

[dependencies]
openarch-abi = { path = "../abi" }

[targets.openarch]
kind = "lib"

# ⚠️ THE BACKEND IS SELECTED BY THE TARGET, NOT BY THE CONSUMER.
#
# A consumer writes `openarch = "0.3.1"` and says nothing about its
# architecture; the row below resolves the matching backend. That is the
# property the single-package layout had, and a split that cost it would be a
# worse arrangement wearing a better directory tree.
#
# `os = "none"` is part of the predicate for the same reason it is in the
# backends' own `cfg`: a hosted aarch64 build — a macOS runner, for instance —
# has an operating system already, and pulling a kernel's machine layer into it
# once produced ELF assembly compiled for Mach-O.
[target.'cfg(all(arch = "riscv64", os = "none"))'.dependencies]
openarch-riscv64 = { path = "../backends/riscv64" }

[target.'cfg(all(arch = "aarch64", os = "none"))'.dependencies]
openarch-aarch64 = { path = "../backends/aarch64" }
